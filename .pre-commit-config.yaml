# Local enforcement of the same static checks CI gates on. Set up once:
#
#   pip install -e ".[dev]" -c constraints-dev.txt
#   pre-commit install        # wires both the pre-commit and commit-msg stages
#
# Thereafter every commit runs ruff (lint + format), mypy, file-hygiene checks, and a
# Conventional-Commits check on the message.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the ruff pin in constraints-dev.txt.
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy checks the installed package, so it runs in the project env, not an isolated one.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: mypy
        language: system
        pass_filenames: false
        types_or: [python, toml]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
